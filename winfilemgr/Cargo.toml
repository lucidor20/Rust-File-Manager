[package]
name = "winfilemgr"
version = "0.1.0"
edition = "2021"
description = "A compact dual-pane file manager with Windows 11 style, portable EXE"
authors = ["Grok"]

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
chrono = "0.4"
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
